<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Minh họa mạng lưới hợp tác xã kết nối các hộ nông dân quanh biểu tượng HTX">
  <defs>
    <clipPath id="c2"><circle cx="100" cy="100" r="100"/></clipPath>
    <g id="house">
      <path d="M-13 4 L0 -9 L13 4 Z" fill="#16a34a"/>
      <rect x="-10" y="3" width="20" height="14" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <rect x="-3" y="8" width="6" height="9" rx="1.5" fill="#bbf7d0"/>
    </g>
    <g id="sprout">
      <path d="M0 10 V-2" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 2 C-8 2 -12 -3 -13 -9 C-5 -9 0 -4 0 2 Z" fill="#22c55e"/>
      <path d="M0 -1 C8 -1 12 -6 13 -12 C5 -12 0 -7 0 -1 Z" fill="#16a34a"/>
    </g>
  </defs>
  <g clip-path="url(#c2)">
    <rect width="200" height="200" fill="#e8f6ea"/>
    <circle cx="100" cy="100" r="66" fill="none" stroke="#86efac" stroke-width="3" stroke-dasharray="6 8"/>
    <g stroke="#a7d3ae" stroke-width="2.5" stroke-dasharray="4 5">
      <path d="M100 100 L100 34"/><path d="M100 100 L100 166"/>
      <path d="M100 100 L34 100"/><path d="M100 100 L166 100"/>
      <path d="M100 100 L54 54"/><path d="M100 100 L146 54"/>
      <path d="M100 100 L54 146"/><path d="M100 100 L146 146"/>
    </g>
    <!-- 4 hộ around -->
    <g transform="translate(100 30)"><use href="#house"/></g>
    <g transform="translate(170 100)"><use href="#house"/></g>
    <g transform="translate(100 170)"><use href="#sprout"/></g>
    <g transform="translate(30 100)"><use href="#sprout"/></g>
    <g transform="translate(52 50)"><use href="#house" transform="scale(.72)"/></g>
    <g transform="translate(148 50)"><use href="#sprout" transform="scale(.72)"/></g>
    <g transform="translate(52 150)"><use href="#sprout" transform="scale(.72)"/></g>
    <g transform="translate(148 150)"><use href="#house" transform="scale(.72)"/></g>
    <!-- trung tâm HTX -->
    <circle cx="100" cy="100" r="30" fill="#15803d"/>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M100 86 v22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M100 94 c-7 0 -11 -4 -12 -10 7 0 11 4 12 10 z" fill="#bbf7d0"/>
    <path d="M100 92 c7 0 11 -4 12 -10 -7 0 -11 4 -12 10 z" fill="#dcfce7"/>
    <text x="100" y="126" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14532d">HTX</text>
  </g>
  <circle cx="100" cy="100" r="99" fill="none" stroke="#cbe7d3" stroke-width="2"/>
</svg>

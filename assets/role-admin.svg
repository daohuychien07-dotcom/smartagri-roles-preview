      <g fill="#22c55e">
        <rect x="64" y="76" width="9" height="18" rx="2"/>
        <rect x="78" y="66" width="9" height="28" rx="2"/>
        <rect x="92" y="72" width="9" height="22" rx="2"/>
        <rect x="106" y="58" width="9" height="36" rx="2" fill="#15803d"/>
      </g>
      <path d="M62 94 h68" stroke="#a7d3ae" stroke-width="2"/>

      <rect x="76" y="114" width="48" height="6" rx="3" fill="#4b5563"/>
    </g>
    <!-- bàn -->
    <rect x="10" y="120" width="180" height="14" rx="4" fill="#cbe7d3"/>
    <rect x="10" y="132" width="180" height="68" fill="#b7d9c2"/>
    <!-- bàn phím + chuột -->
    <rect x="60" y="136" width="62" height="14" rx="3" fill="#f9fafb" stroke="#9dbfa8" stroke-width="2"/>

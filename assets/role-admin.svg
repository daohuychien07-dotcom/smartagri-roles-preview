      <circle cx="52" cy="132" r="19" fill="#f2c39a"/>
      <path d="M33 128 C33 110 42 106 52 106 C62 106 71 110 71 128 C66 118 60 116 52 116 C44 116 38 118 33 128 Z" fill="#3f3f46"/>
